name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: read

jobs:
  app:
    name: App (lint, testes e build) - Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependências (versões exatas do package-lock)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Testes automatizados
        run: npm test

      - name: Build (empacotamento)
        run: npm run build

      - name: Publicar artefato do build
        if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: pacote-api
          path: dist/*.tgz

  infra:
    name: Infra (Terraform fmt e validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Verificar formatação
        run: terraform fmt -check -recursive

      - name: Inicializar (sem backend remoto)
        run: terraform init -backend=false -input=false

      - name: Validar configuração
        run: terraform validate

  image:
    name: Imagem Docker (build, smoke test e publicação no GHCR)
    needs: [app, infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publicar a imagem no GitHub Container Registry
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Construir a imagem
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      - name: Smoke test do container (/health deve responder 200)
        run: |
          docker run -d --name api -p 3000:3000 "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 15); do curl -fsS localhost:3000/health && exit 0; sleep 1; done
          docker logs api; exit 1

      # Só a main publica: PRs validam a imagem, mas não geram versão.
      - name: Publicar no GHCR (tags com o SHA do commit e latest)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  kubernetes:
    name: Orquestração (Kubernetes com kind)
    needs: [app, infra]
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Construir a imagem deste commit
        run: docker build -t "$IMAGE" .

      # kind = Kubernetes descartável rodando em containers dentro do próprio runner.
      - name: Criar cluster Kubernetes (kind) e carregar a imagem
        run: |
          kind version && kubectl version --client
          kind create cluster --name ci --wait 120s
          kind load docker-image "$IMAGE" --name ci

      - name: Deploy, rolling update, autocura e smoke test
        run: scripts/k8s-deploy.sh "$IMAGE"

      - name: Diagnóstico do cluster (só em caso de falha)
        if: failure()
        run: |
          kubectl get pods -l app=api -o wide
          kubectl describe pods -l app=api | tail -n 60
          kubectl get events --sort-by=.lastTimestamp | tail -n 30

  deploy:
    name: Deploy na AWS (EC2 via SSM)
    needs: [image, kubernetes] # só vai para produção se a orquestração também passou
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws-academy
    # Credenciais temporárias do AWS Academy Learner Lab: expiram a cada sessão e são atualizadas nos secrets.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Deploy da imagem deste commit e smoke test
        run: scripts/deploy.sh "ghcr.io/${{ github.repository }}:${{ github.sha }}"

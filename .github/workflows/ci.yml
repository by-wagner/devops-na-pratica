name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: read

jobs:
  app:
    name: App (lint, testes e build) - Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Lint (verificação de sintaxe)
        run: npm run lint

      - name: Testes automatizados
        run: npm test

      - name: Build (empacotamento)
        run: npm run build

      - name: Publicar artefato do build
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: pacote-api
          path: dist/*.tgz

  infra:
    name: Infra (Terraform fmt e validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Verificar formatação
        run: terraform fmt -check -recursive

      - name: Inicializar (sem backend remoto)
        run: terraform init -backend=false -input=false

      - name: Validar configuração
        run: terraform validate
